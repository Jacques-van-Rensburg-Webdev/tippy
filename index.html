<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tippy</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">

    <!-- Zone: Header (56pt) -->
    <header class="app-header">
      <div class="app-header-inner">
        <h1 class="app-title">Tippy</h1>
        <button class="icon-button" type="button" aria-label="Settings">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
        </button>
      </div>
    </header>

    <!-- Zone: Content (scrolls) -->
    <main class="app-content">
      <div class="grid">

        <!-- Content, columns 1–4, at 0 -->
        <section class="span-4 card stack-1">
          <h2 class="text-lg text-bold">Welcome</h2>
          <p class="text-sm text-muted">Press G to show the grid overlay. Replace this screen with your own.</p>
        </section>

        <!-- Content, columns 1–2 and 3–4 -->
        <article class="span-2 card">
          <p class="text-bold">Column 1–2</p>
          <p class="text-sm text-muted">Half width</p>
        </article>
        <article class="span-2 card">
          <p class="text-bold">Column 3–4</p>
          <p class="text-sm text-muted">Half width</p>
        </article>

        <!-- Content, columns 1–4 -->
        <div class="span-4 mt-1">
          <button class="button button-primary button-block" type="button">Primary action</button>
        </div>

      </div>
    </main>

    <!-- Zone: Tab bar (56pt + safe area) -->
    <nav class="app-tabbar" aria-label="Main">
      <div class="app-tabbar-inner">
        <a class="tab" href="#" aria-current="page">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11 12 4l9 7v9H3z"/></svg>
          Home
        </a>
        <a class="tab" href="#">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          Search
        </a>
        <a class="tab" href="#">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          Profile
        </a>
      </div>
    </nav>

  </div>
</body>
</html>
