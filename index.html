<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F3D45">
  <title>Tippy</title>
  <link rel="icon" href="assets/images/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/win95.css">
  <link rel="stylesheet" href="css/screens.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Header: keeps clear of the notch. Each screen starts with its window's title bar. -->
  <header class="app-header"></header>

  <!-- Content: the screen's windows, in one column on the teal desktop (js/views/) -->
  <main class="app-content" id="screen"></main>

  <!-- Tab bar: the taskbar (Today · Payout · Week · Staff) -->
  <nav class="app-tabbar" aria-label="Sections">
    <div class="app-tabbar-inner" id="tabs"></div>
  </nav>

  <!-- The Log tips dialog (js/views/log-dialog.js) and messages -->
  <div id="dialog"></div>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
